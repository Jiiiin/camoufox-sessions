name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile native launcher
        run: xcrun swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library src/Launcher.swift -o /tmp/CamoufoxSessions -framework SwiftUI -framework AppKit
      - name: Check Python syntax
        run: python3 -m compileall -q src scripts tests
